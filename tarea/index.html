<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarea Lab 08 - Registro de notas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 680px; margin: 30px auto; padding: 0 16px; color: #222; }
    h1 { color: #1f4e79; margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    section { border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input { padding: 6px 8px; font-size: 15px; }
    button { padding: 6px 12px; font-size: 15px; cursor: pointer; }
    #lista { list-style: none; padding: 0; margin: 0; }
    #lista li { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid #eee; }
    .aprobado { border-left: 5px solid #2e7d32; }
    .desaprobado { border-left: 5px solid #c0392b; }
    .estado { font-size: 13px; color: #555; margin-left: 8px; }
    .borrar { background: #fdecea; border: 1px solid #c0392b; color: #c0392b; padding: 2px 8px; }
    .error { color: #c0392b; }
    .ok { color: #2e7d32; }
    .resumen { font-size: 18px; }
  </style>
</head>
<body>
  <h1>Registro de notas</h1>
  <p class="sub">Escala vigesimal (0 a 20). Nota minima aprobatoria: 11.</p>

  <section>
    <h2>Agregar estudiante</h2>
    <form id="formEstudiante">
      <input id="nombre" type="text" placeholder="Nombre del estudiante">
      <input id="nota" type="number" step="0.5" placeholder="Nota (0 a 20)">
      <button type="submit">Agregar</button>
    </form>
    <p id="mensaje"></p>
  </section>

  <section>
    <h2>Estudiantes</h2>
    <input id="buscar" type="text" placeholder="Buscar por nombre...">
    <ul id="lista"></ul>
  </section>

  <section>
    <p class="resumen">Promedio del grupo: <strong id="promedio">0.00</strong></p>
    <p>Aprobados: <span id="aprobados">0</span> de <span id="cantidad">0</span></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
